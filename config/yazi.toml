[mgr]
ratio = [1, 3, 4]
sort_by = "natural"
sort_sensitive = false
sort_reverse = false
linemode = "mtime"
show_hidden = false
show_symlink = true
scrolloff = 5
title_format = "Yazi: {cwd}"

[preview]
wrap = "yes"

[opener]
edit = [
  { run = "nvim %s", block = true, desc = "nvim", for = "unix" },
]
render-markdown = [
  { run = "glow -p -s dark %s1", block = true, desc = "Render Markdown", for = "unix" },
]
preview-pdf = [
  { run = '"$HOME/.config/yazi/scripts/preview_pdf.sh" %s1 | less -R', block = true, desc = "Preview PDF", for = "unix" },
]
preview-xlsx = [
  { run = '"$HOME/.config/yazi/scripts/preview_xlsx.py" %s1 | less -R', block = true, desc = "Preview XLSX", for = "unix" },
]
preview-pptx = [
  { run = '"$HOME/.config/yazi/scripts/preview_pptx.py" %s1 | less -R', block = true, desc = "Preview PPTX", for = "unix" },
]
preview-docx = [
  { run = '"$HOME/.config/yazi/scripts/preview_docx.sh" %s1 | less -R', block = true, desc = "Preview DOCX", for = "unix" },
]

[open]
prepend_rules = [
  { url = "*.md", use = [ "render-markdown", "edit", "reveal" ] },
  { url = "*.markdown", use = [ "render-markdown", "edit", "reveal" ] },
  { url = "*.mdx", use = [ "render-markdown", "edit", "reveal" ] },
  { url = "*.rmd", use = [ "render-markdown", "edit", "reveal" ] },
  { url = "*.qmd", use = [ "render-markdown", "edit", "reveal" ] },
  { mime = "application/pdf", use = [ "preview-pdf", "open", "reveal" ] },
  { url = "*.xlsx", use = [ "preview-xlsx", "open", "reveal" ] },
  { url = "*.pptx", use = [ "preview-pptx", "open", "reveal" ] },
  { url = "*.docx", use = [ "preview-docx", "open", "reveal" ] },
]

[[plugin.prepend_previewers]]
url = "*.md"
run = 'piper -- CLICOLOR_FORCE=1 glow -w=$w -s=dark "$1"'

