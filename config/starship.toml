"$schema" = "https://starship.rs/config-schema.json"

add_newline = true
palette = "gruvbox_dark"

# This is the Starship prompt, not a bottom status line.
# Change segment order in `format`, colors in `[palettes.gruvbox_dark]`,
# and per-segment behavior in each module block below.
format = """
[](color_orange)\
$os\
$username\
$hostname\
[](bg:color_yellow fg:color_orange)\
$directory\
[](fg:color_yellow bg:color_bg3)\
$rlang\
$git_branch\
$git_state\
$git_status\
[](fg:color_bg3 bg:color_bg1)\
$time\
[](fg:color_bg1)\
$line_break\
$character"""

[palettes.gruvbox_dark]
color_fg0 = "#fbf1c7"
color_bg1 = "#3c3836"
color_bg3 = "#665c54"
color_blue = "#458588"
color_aqua = "#689d6a"
color_green = "#98971a"
color_orange = "#d65d0e"
color_purple = "#b16286"
color_red = "#cc241d"
color_yellow = "#d79921"

[os]
disabled = false
style = "bg:color_orange fg:color_fg0"

[os.symbols]
Macos = "󰀵"
Linux = "󰌽"
Ubuntu = "󰕈"
Windows = "󰍲"

[username]
show_always = true
style_user = "bg:color_orange fg:color_fg0"
style_root = "bg:color_orange fg:color_fg0"
format = "[ $user ]($style)"

[hostname]
ssh_only = true
style = "bg:color_orange fg:color_fg0"
format = "[ @ $hostname ]($style)"

[directory]
style = "fg:color_fg0 bg:color_yellow"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Pictures" = " "
"Desktop" = " "

[rlang]
disabled = false
symbol = "󰟔 "
detect_extensions = ["R", "Rd", "Rmd", "Rproj", "Rsx"]
detect_files = [".Rprofile", ".Rproj", "DESCRIPTION", "NAMESPACE"]
detect_folders = [".Rproj.user"]
style = "fg:#83a598 bg:color_bg3"
format = "[ $symbol($version) ]($style)"

[git_branch]
symbol = " "
style = "fg:color_purple bg:color_bg3"
format = "[ $symbol$branch]($style)"

[git_state]
style = "fg:color_orange bg:color_bg3"
format = "[ $state( $progress_current/$progress_total)]($style)"

[git_status]
style = "fg:color_red bg:color_bg3"
format = "([ $all_status$ahead_behind]($style))"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
modified = "!${count}"
staged = "+${count}"
untracked = "?${count}"
renamed = "»${count}"
deleted = "✘${count}"

[time]
disabled = false
time_format = "%R"
style = "bg:color_bg1"
format = "[[  $time ](fg:color_fg0 bg:color_bg1)]($style)"

[line_break]
disabled = false

[character]
disabled = false
success_symbol = "[>](bold green)"
error_symbol = "[>](bold red)"
vimcmd_symbol = "[<](bold yellow)"
